<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="BabelCodec — offline-first encoding, Unicode text lab, Morse, SHA-256 computer, educational CPU, Image Studio." />
  <title>BabelCodec — Byte & Symbolic Workbench</title>
  <link rel="stylesheet" href="src/ui/styles.css?v=0.11.1" />
  <link rel="stylesheet" href="src/ui/lab-layout.css?v=0.11.1" />
  <link rel="stylesheet" href="src/ui/studio.css?v=0.11.1" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◈</span>
      <div class="brand-text">
        <strong>BabelCodec</strong>
        <span class="brand-sub">byte · unicode · signal · image</span>
      </div>
    </div>
    <nav class="app-nav" aria-label="Primary">
      <button type="button" class="nav-tab" data-tab="converter">Converter</button>
      <button type="button" class="nav-tab" data-tab="inspector">Hex</button>
      <button type="button" class="nav-tab" data-tab="structure">Structure</button>
      <button type="button" class="nav-tab" data-tab="logic">Logic Lab</button>
      <button type="button" class="nav-tab" data-tab="text">Text Lab</button>
      <button type="button" class="nav-tab" data-tab="computer">Computer Lab</button>
      <button type="button" class="nav-tab" data-tab="cpu">CPU Lab</button>
      <button type="button" class="nav-tab" data-tab="media">Image Studio</button>
    </nav>
  </header>

  <main class="app-main">
    <section id="view-converter" class="view" hidden></section>
    <section id="view-inspector" class="view" hidden></section>
    <section id="view-structure" class="view" hidden></section>
    <section id="view-logic" class="view" hidden></section>
    <section id="view-text" class="view" hidden></section>
    <section id="view-computer" class="view" hidden></section>
    <section id="view-cpu" class="view" hidden></section>
    <section id="view-media" class="view">
      <div id="media-root" class="media-root"></div>
    </section>
  </main>

  <footer class="app-footer">
    <span>BabelCodec v0.11.1 · offline · client-side only · Unicode Core WASM</span>
    <span>
      <a href="https://github.com/TheBabelDragon/BabelCodec">GitHub</a>
      · TheBabelDragon
    </span>
  </footer>

  <script type="module" src="src/ui/app.js?v=0.11.1"></script>
</body>
</html>
