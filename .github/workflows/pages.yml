name: Test and Deploy

on:
  push:
    branches: [main, fix/commit-pkg-wasm-assets]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Generate Cargo.lock
        run: cd rust && cargo generate-lockfile

      - name: Cargo test
        run: cd rust && cargo test -p unicode-core --lib -- --nocapture

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Build WASM package
        run: |
          set -e
          cd rust
          cargo build --release --target wasm32-unknown-unknown -p unicode-core
          wasm-bindgen --target web --out-dir ../pkg \
            target/wasm32-unknown-unknown/release/unicode_core.wasm
          ls -la ../pkg/
          test -f ../pkg/unicode_core.js
          test -f ../pkg/unicode_core_bg.wasm
          # Ensure JS refers to local wasm (wasm-bindgen default)
          head -c 200 ../pkg/unicode_core.js || true

      - name: Run Node tests
        run: |
          node --test \
            tests/**/*.test.js \
            tests/logic/**/*.test.js \
            tests/sha256/**/*.test.js \
            tests/computer/**/*.test.js \
            tests/cpu/**/*.test.js \
            tests/text/**/*.test.js \
            tests/scripts/**/*.test.js \
            tests/morse/**/*.test.js \
            tests/digest/**/*.test.js \
            tests/computer/architecture/**/*.test.js \
            tests/media/**/*.test.js \
            tests/ui/**/*.test.js \
            tests/neural/**/*.test.js

      - name: Build verification
        run: node scripts/build.js

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicode-core-wasm
          path: pkg/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Generate Cargo.lock
        run: cd rust && cargo generate-lockfile

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked

      - name: Build WASM into pkg/ for Pages
        run: |
          set -e
          cd rust
          cargo build --release --target wasm32-unknown-unknown -p unicode-core
          wasm-bindgen --target web --out-dir ../pkg \
            target/wasm32-unknown-unknown/release/unicode_core.wasm
          test -f ../pkg/unicode_core.js
          test -f ../pkg/unicode_core_bg.wasm
          ls -la ../pkg/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
