name: Test and Deploy

on:
  push:
    branches: [main, fix/wasm-loader-deploy-reliability]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Must match the wasm-bindgen crate version linked into the .wasm
env:
  WASM_BINDGEN_VERSION: '0.2.130'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Generate Cargo.lock if missing
        run: |
          if [ ! -f rust/Cargo.lock ]; then
            cd rust && cargo generate-lockfile
          fi

      - name: Cargo test
        run: cd rust && cargo test -p unicode-core --lib -- --nocapture

      - name: Install wasm-bindgen-cli (pinned to crate schema)
        run: |
          set -euo pipefail
          if command -v wasm-bindgen >/dev/null 2>&1; then
            cur=$(wasm-bindgen --version || true)
            echo "found: $cur"
            if echo "$cur" | grep -q "${WASM_BINDGEN_VERSION}"; then
              echo "wasm-bindgen ${WASM_BINDGEN_VERSION} already installed"
              exit 0
            fi
          fi
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Build WASM (npm run build:wasm)
        run: |
          set -euo pipefail
          node scripts/build-wasm.js
          test -s pkg/unicode_core.js
          test -s pkg/unicode_core_bg.wasm
          ls -la pkg/
          grep -q unicode_core_bg.wasm pkg/unicode_core.js

      - name: Run Node tests
        run: |
          node --test \
            tests/**/*.test.js \
            tests/logic/**/*.test.js \
            tests/sha256/**/*.test.js \
            tests/computer/**/*.test.js \
            tests/cpu/**/*.test.js \
            tests/text/**/*.test.js \
            tests/scripts/**/*.test.js \
            tests/morse/**/*.test.js \
            tests/digest/**/*.test.js \
            tests/computer/architecture/**/*.test.js \
            tests/media/**/*.test.js \
            tests/ui/**/*.test.js \
            tests/neural/**/*.test.js

      - name: Build verification
        run: node scripts/build.js

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: unicode-core-wasm
          path: pkg/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Generate Cargo.lock if missing
        run: |
          if [ ! -f rust/Cargo.lock ]; then
            cd rust && cargo generate-lockfile
          fi

      - name: Install wasm-bindgen-cli (pinned to crate schema)
        run: |
          set -euo pipefail
          if command -v wasm-bindgen >/dev/null 2>&1; then
            cur=$(wasm-bindgen --version || true)
            if echo "$cur" | grep -q "${WASM_BINDGEN_VERSION}"; then
              echo "wasm-bindgen ${WASM_BINDGEN_VERSION} already installed"
              exit 0
            fi
          fi
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Build WASM into pkg/ for Pages
        run: |
          set -euo pipefail
          node scripts/build-wasm.js
          test -s pkg/unicode_core.js
          test -s pkg/unicode_core_bg.wasm
          grep -q unicode_core_bg.wasm pkg/unicode_core.js
          ls -la pkg/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy smoke (public assets)
        run: |
          set -euo pipefail
          BASE="https://thebabeldragon.github.io/BabelCodec"
          echo "Waiting for CDN…"
          code_js=000
          code_wasm=000
          for i in 1 2 3 4 5 6 7 8; do
            code_js=$(curl -s -o /tmp/uc.js -w "%{http_code}" "$BASE/pkg/unicode_core.js" || echo 000)
            code_wasm=$(curl -s -o /tmp/uc.wasm -w "%{http_code}" "$BASE/pkg/unicode_core_bg.wasm" || echo 000)
            echo "attempt $i js=$code_js wasm=$code_wasm"
            if [ "$code_js" = "200" ] && [ "$code_wasm" = "200" ]; then
              break
            fi
            sleep 15
          done
          test "$code_js" = "200"
          test "$code_wasm" = "200"
          head -c 20 /tmp/uc.js | grep -vq '<!'
          python3 -c "d=open('/tmp/uc.wasm','rb').read(4); assert d==b'\\x00asm', d"
          grep -q unicode_core_bg.wasm /tmp/uc.js
          echo "Post-deploy smoke OK"
